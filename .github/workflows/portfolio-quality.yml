name: Portfolio quality checks

on:
  push:
    paths:
      - "index.html"
      - ".github/workflows/portfolio-quality.yml"
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/portfolio-quality.yml"
  workflow_dispatch:

jobs:
  hallmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install browser test dependency
        run: npm install --global puppeteer-core
      - name: Fetch Hallmark checks
        run: git clone --depth 1 https://github.com/Nutlope/hallmark.git /tmp/hallmark
      - name: Run Hallmark static and responsive render checks
        run: node /tmp/hallmark/skills/hallmark/scripts/sloplint.mjs index.html --genre editorial --render
